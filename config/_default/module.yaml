############################
## HUGO MODULES
## Install or uninstall themes and plugins here.
## Docs: https://gohugo.io/hugo-modules/
############################

imports:
  - path: github.com/HugoBlox/kit/modules/integrations/netlify
  - path: github.com/HugoBlox/kit/modules/blox
  - path: github.com/HugoBlox/kit/modules/slides

# Install any Hugo Blox within the `hugo-blox/blox/` folder
mounts:
  - source: hugo-blox/blox/community
    target: layouts/_partials/blox/community/
    files:
      - '**.html'
  - source: hugo-blox/blox/all-access
    target: layouts/_partials/blox/
    files:
      - '**.html'
  - source: hugo-blox/blox
    target: assets/dist/community/blox/
    files:
      - '**.css'
  - source: layouts
    target: layouts
  - source: assets
    target: assets
  # Content: the normal mount, plus the English publications mounted a second
  # time into the Serbian site, so Publikacije lists them (in English) without
  # keeping Serbian copies. The papers list page itself is translated in
  # content/papers/_index.sr.md, so it is excluded from the second mount.
  - source: content
    target: content
  - source: content/papers
    target: content/papers
    sites:
      matrix:
        languages: [sr]
    files:
      - '! _index.md'
      - '! **.sr.md'
