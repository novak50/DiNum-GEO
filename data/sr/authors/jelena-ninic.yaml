# Serbian overrides for data/authors/jelena-ninic.yaml (merged over it on the /sr/ site).
role: Partner na projektu
affiliations:
  - name: Univerzitet u Daramu
bio: >-
  Jelena je profesorka digitalnog inženjerstva na Departmanu za inženjerstvo
  Univerziteta u Daramu (Velika Britanija). Njeno istraživanje povezuje
  računarsku mehaniku, digitalno inženjerstvo, informaciono modeliranje
  objekata (BIM), digitalne blizance, mašinsko učenje i inteligentno
  računarstvo, sa snažnim fokusom na podzemnu gradnju i interakciju tla i
  konstrukcije. Ima veliko iskustvo u razvoju parametarskih informacionih
  modela, naprednih formulacija metode konačnih elemenata, automatizovanih
  tokova rada od projekta do analize i BIM modeliranja tunelskih projekata.
  Njena ekspertiza je ključna za razvoj interoperabilnih, integrisanih
  tokova digitalnog i numeričkog modeliranja kroz BIM, kako je predviđeno
  projektom DiNum-GEO. Doprinosi ključnim znanjem iz naprednog numeričkog
  modeliranja, BIM integracije, automatizacije i šireg koncepta digitalnog
  blizanca na kome se projekat zasniva.
