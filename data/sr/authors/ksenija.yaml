# Serbian overrides for data/authors/ksenija.yaml (merged over it on the /sr/ site).
role: Član tima
affiliations:
  - name: Građevinski fakultet, Univerzitet u Beogradu
bio: >-
  Ksenija je asistent na Građevinskom fakultetu Univerziteta u Beogradu, sa
  obrazovanjem u oblasti geološkog inženjerstva, u kojoj izrađuje i
  doktorsku disertaciju. Njeno istraživanje usmereno je na razvoj digitalnih
  modela terena i njihovu integraciju u numeričko modeliranje za složene i
  heterogene geološke i geotehničke uslove, sa posebnim naglaskom na
  litološku i geotehničku prostornu varijabilnost i neizvesnost. Njena
  ekspertiza u oblasti geološkog inženjerstva, geoinformatike, mehanike tla
  i stena predstavlja geološku osnovu okvira DiNum-GEO. Njen glavni doprinos
  odnosi se na razvoj informacionih modela terena (GIM) i primenu
  geostatističkih pristupa za prostornu varijabilnost i kvantifikaciju
  neizvesnosti.
