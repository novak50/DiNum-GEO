role: Član tima
affiliations:
  - name: Građevinski fakultet, Univerzitet u Beogradu
bio: >-
  Novak je asistent na Građevinskom fakultetu Univerziteta u Beogradu, sa
  obrazovanjem u oblasti konstrukterstva i profesionalnim iskustvom u
  projektovanju konstrukcija. Njegovo doktorsko istraživanje usmereno je na
  složenost izgradnje tunela u heterogenim i anizotropnim geotehničkim
  sredinama. Njegova ekspertiza objedinjuje tunelogradnju, mehaniku stena i
  napredno numeričko modeliranje, uz snažno interesovanje za programiranje i
  automatizaciju modela. Njegov multidisciplinarni profil posebno je značajan
  za razvoj numeričkih modela podzemnih konstrukcija, gde geološku i
  geotehničku složenost, odgovor konstrukcije i računarsko modeliranje treba
  sagledati kao jedinstvenu celinu.
