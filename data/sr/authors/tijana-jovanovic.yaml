# Serbian overrides for data/authors/tijana-jovanovic.yaml (merged over it on the /sr/ site).
role: Partner na projektu
affiliations:
  - name: Britanski geološki zavod
bio: >-
  Tijana se u Britanskom geološkom zavodu (Velika Britanija) bavi
  modeliranjem površine i podzemlja, sa ekspertizom u hidrološkom
  modeliranju, statističkom računarstvu i korišćenju geoprostornih podataka
  visoke rezolucije. Njeno iskustvo u integraciji geoprostornih informacija
  u digitalne modele i radu sa javnim bazama podataka direktno doprinosi
  razvoju modela terena u projektu DiNum-GEO. U okviru projekta, njeno
  iskustvo u modeliranju posebno je važno za uključivanje stvarnih
  geoprostornih podataka, upravljanje neizvesnošću i ažuriranje modela kako
  novi podaci postaju dostupni. Njen doprinos jača deo projekta zasnovan na
  podacima i pomaže povezivanju naprednog geonaučnog informacionog
  modeliranja sa numeričkom analizom i projektovanjem podzemnih konstrukcija
  uz uvažavanje rizika.
